  - { id: T-CLS-002, label: dim.classifying,     display: 分类族,   family: dimension,  layer: L2, definition: 记录是什么（归类维度）,       applies_to: [any_record],        related_dimensions: [classifying], action: action.resolve_from_config, status: active, scope: generic }
  - { id: T-CLS-003, label: nature.root,          display: 性质族,   family: nature,     layer: L2, definition: AI 能不能动这格,             applies_to: [any_cell],          related_dimensions: [nature],      action: action.emit_pending_list,   status: active, scope: generic }
  - { id: T-CLS-004, label: governance.caliber,   display: 判定口径, family: governance, layer: L2, definition: 什么算找到（不改业务事实）,   applies_to: [exam_and_gate],     related_dimensions: [governance],  action: action.resolve_from_config, status: active, scope: generic }
  - { id: T-CLS-005, label: governance.sensitive, display: 敏感策略, family: governance, layer: L2, definition: 按字段语义扣留,               applies_to: [sensitive_field],   related_dimensions: [governance],  action: action.withhold_and_point,  status: active, scope: generic }
  - { id: T-CLS-006, label: governance.acceptance,display: 验收裁判, family: governance, layer: L2, definition: 交付前把关,                   applies_to: [exam_and_gate],     related_dimensions: [governance],  action: action.diff_preview_before_write, status: active, scope: generic }

